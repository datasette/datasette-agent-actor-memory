[project]
name = "datasette-agent-actor-memory"
version = "0.0.1a0"
description = "Per-actor private memory store for datasette-agent — agent tools + UI"
readme = "README.md"
authors = [{name = "Alex Garcia"}]
license = "Apache-2.0"
classifiers = [
    "Framework :: Datasette",
]
requires-python = ">=3.10"
dependencies = [
    "datasette>1a",
    "datasette-plugin-router>=0.0.1a3",
    "datasette-vite>=0.0.1a4",
    "datasette-agent",
    "sqlite-migrate>=0.1b0",
    "sqlite-utils>=3.38",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.15.12",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/datasette/datasette-agent-actor-memory"

[project.entry-points.datasette]
agent_actor_memory = "datasette_agent_actor_memory"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["datasette_agent_actor_memory*"]

[tool.setuptools.package-data]
datasette_agent_actor_memory = ["static/**/*", "templates/**/*", "manifest.json"]
